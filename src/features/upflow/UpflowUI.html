<!DOCTYPE html>
<html>
<head>
  <title>UpFlow</title>
  <link href="https://rsms.me/inter/inter.css" rel="stylesheet" crossorigin="anonymous">
  <style>
    @import url('./Header/styles.css');
    :root {
      --font-stack: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-size-xsmall: 11px;
      --font-size-small: 12px;
      --font-size-large: 14px;
      --spacing-xxsmall: 4px;
      --spacing-xsmall: 8px;
      --spacing-small: 12px;
      --spacing-med: 16px;
      --spacing-large: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-stack);
      font-size: var(--font-size-small);
      color: var(--figma-color-text);
      background-color: var(--figma-color-bg);
      margin: 0;
      padding: var(--spacing-med);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .section {
      margin-bottom: var(--spacing-med);
    }

    .label {
      display: block;
      font-size: var(--font-size-xsmall);
      font-weight: 500;
      margin-bottom: var(--spacing-xxsmall);
      color: var(--figma-color-text);
    }

    .upload-area {
      position: relative;
      width: 100%;
      min-height: 80px;
      border: 2px dashed var(--figma-color-border);
      border-radius: 4px;
      padding: var(--spacing-med);
      display: flex;
      align-items: center;
      gap: var(--spacing-small);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .upload-area:hover {
      border-color: var(--figma-color-border-strong);
      background: var(--figma-color-bg-hover);
    }

    .upload-icon {
      width: 24px;
      height: 24px;
      color: var(--figma-color-icon);
    }

    .upload-content {
      flex: 1;
    }

    .upload-text {
      font-size: var(--font-size-small);
      color: var(--figma-color-text);
      margin-bottom: var(--spacing-xxsmall);
    }

    .upload-subtext {
      font-size: var(--font-size-xsmall);
      color: var(--figma-color-text-secondary);
    }

    .file-input {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0;
      cursor: pointer;
    }

    .component-list-container {
      flex: 1;
      border: 1px solid var(--figma-color-border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: var(--spacing-med);
    }

    .component-list {
      padding: var(--spacing-small);
      overflow-y: auto;
      height: 100%;
    }

    .component-item {
      padding: var(--spacing-small);
      border: 1px solid var(--figma-color-border);
      border-radius: 4px;
      margin-bottom: var(--spacing-small);
    }

    .component-name {
      font-weight: 500;
      margin-bottom: var(--spacing-xxsmall);
    }

    .component-tags {
      font-size: var(--font-size-xsmall);
      color: var(--figma-color-text-secondary);
    }

    .button {
      width: 100%;
      height: 32px;
      background: var(--figma-color-bg-brand);
      color: var(--figma-color-text-onbrand);
      border: none;
      border-radius: 6px;
      font-size: var(--font-size-small);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .button:hover:not(:disabled) {
      background: var(--figma-color-bg-brand-hover);
    }

    .status {
      margin-top: var(--spacing-small);
      padding: var(--spacing-xsmall) var(--spacing-small);
      border-radius: 4px;
      font-size: var(--font-size-xsmall);
    }

    .status-success {
      background: var(--figma-color-bg-success);
      color: var(--figma-color-text-success);
    }

    .status-error {
      background: var(--figma-color-bg-danger);
      color: var(--figma-color-text-danger);
    }

    .status-info {
      background: var(--figma-color-bg-secondary);
      color: var(--figma-color-text);
    }
  </style>
</head>
<body>
  <div class="plugin-header">
    <div class="header-content">
      <div class="header-left">
        <button class="header-back" aria-label="Back to menu">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <h1 class="header-title">UpFlow</h1>
      </div>
      <button class="header-close" aria-label="Close plugin">
        <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
          <path d="M1 1L7 7M7 1L1 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="section">
    <label class="label">Upload document</label>
    <div id="uploadArea" class="upload-area">
      <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" 
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div id="uploadContent" class="upload-content">
        <div class="upload-text">Drop your file here or click to browse</div>
        <div class="upload-subtext">Accepts .txt and .docx files</div>
      </div>
      <input 
        type="file" 
        id="fileInput" 
        class="file-input"
        accept=".txt,.docx"
      >
    </div>
  </div>

  <div class="component-list-container">
    <div id="componentList" class="component-list"></div>
  </div>

  <button id="processButton" class="button" disabled>Process Content</button>
  <div id="status"></div>

  <script>
    // Initialize UI
    const ui = {
      fileContent: '',
      currentFileName: '',
      selectedComponents: [],
      isProcessing: false,

      init() {
        this.setupEventListeners();
        this.setupMessageHandling();
      },

      setupEventListeners() {
        // Add back button handler
        document.querySelector('.header-back').addEventListener('click', () => {
          parent.postMessage({ 
            pluginMessage: { 
              type: 'navigate', 
              feature: 'menu'
            } 
          }, '*');
        });

        // Add close button handler
        document.querySelector('.header-close').addEventListener('click', () => {
          parent.postMessage({ 
            pluginMessage: { 
              type: 'close'
            } 
          }, '*');
        });

        // Keep existing event listeners
      },

      setupMessageHandling() {
        // Keep existing message handling
      }
    };

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => ui.init());
  </script>
</body>
</html>
